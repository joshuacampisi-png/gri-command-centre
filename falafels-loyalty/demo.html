<!doctype html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#149BE0" />
<title>Falafels Loyalty — Preview</title>
<style>
:root{
  --blue:#149be0; --blue-dark:#0b7fc4; --blue-deep:#0668a6; --ink:#111418;
  --gold:#f5c518; --soft:#f2f7fb; --muted:#5b6b78; --ok:#1f9d57; --err:#d8463c;
  --radius:20px; --shadow:0 12px 30px rgba(8,60,100,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--soft)}
button{font-family:inherit;cursor:pointer;border:none}
.hidden{display:none!important}

.logo-box{display:inline-flex;flex-direction:column;align-items:flex-start;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;line-height:.98;font-weight:800;font-size:26px;letter-spacing:.5px}
.logo-box.small{padding:6px 9px;font-size:16px;border-radius:6px}

/* Auth */
.auth-screen{min-height:100vh;display:flex;justify-content:center;background:linear-gradient(165deg,var(--blue) 0%,var(--blue-deep) 100%);padding:0 22px}
.auth-inner{width:100%;max-width:420px;padding:56px 0 36px;text-align:center;color:#fff;animation:rise .5s ease both}
.auth-title{font-size:40px;margin:26px 0 10px;font-weight:850;letter-spacing:-.5px}
.auth-sub{font-size:16px;line-height:1.5;color:rgba(255,255,255,.92);margin:0 auto 30px;max-width:320px}
.auth-form{display:flex;flex-direction:column;gap:14px;text-align:left}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:13px;font-weight:700;color:rgba(255,255,255,.9);padding-left:4px}
.field input{padding:15px 16px;border-radius:14px;border:2px solid transparent;background:rgba(255,255,255,.96);font-size:16px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--gold)}
.btn-primary{background:var(--ink);color:#fff;border-radius:14px;font-weight:800;font-size:16px;padding:15px;transition:transform .08s,opacity .2s;margin-top:8px}
.btn-primary:active{transform:scale(.98)}
.link-toggle{background:none;color:#fff;text-decoration:underline;font-size:14px;margin-top:20px;opacity:.95}
.auth-foot{margin-top:38px;font-size:12px;color:rgba(255,255,255,.7)}

/* Dashboard */
.dashboard{max-width:460px;margin:0 auto;padding:20px 18px 40px;min-height:100vh}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hello{font-size:22px;font-weight:850;letter-spacing:-.3px}
.hello-sub{font-size:13px;color:var(--muted);font-weight:600}
.link-logout{background:none;color:var(--muted);font-size:13px;font-weight:600}

/* Streak tracker */
.streak-card{background:#fff;border-radius:18px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 6px 16px rgba(8,60,100,.08);transition:box-shadow .3s}
.streak-card.flare{box-shadow:0 0 0 3px rgba(245,197,24,.55),0 10px 24px rgba(245,150,24,.25)}
.streak-head{display:flex;align-items:center;gap:12px}
.streak-flame{line-height:1;filter:grayscale(1);opacity:.45;transition:font-size .4s cubic-bezier(.2,1.4,.4,1),filter .3s}
.streak-card.active .streak-flame{filter:none;opacity:1;animation:flicker 1.5s ease-in-out infinite}
.streak-card.flare .streak-flame{animation:flare .85s cubic-bezier(.2,1.4,.4,1)}
.streak-count{flex:1}
.streak-num{font-size:28px;font-weight:900;line-height:1;display:flex;align-items:baseline;gap:6px}
.streak-unit{font-size:14px;font-weight:800;color:var(--muted)}
.streak-label{font-size:12.5px;color:var(--muted);margin-top:2px}
.streak-best{text-align:center}
.streak-best strong{display:block;font-size:20px;font-weight:900;color:var(--blue-dark)}
.streak-best span{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.week-track{display:flex;justify-content:space-between;gap:4px;margin:16px 2px 12px}
.day-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.day-dot{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:800;color:#aab8c4;border:2px solid transparent;transition:background .3s,transform .2s,border-color .3s}
.day-dot.is-reward{border-color:rgba(245,197,24,.55)}
.day-dot.on{background:linear-gradient(155deg,var(--blue) 0%,var(--blue-dark) 100%);color:#fff}
.day-dot.on.is-reward{background:linear-gradient(155deg,#ffd95e 0%,var(--gold) 100%)}
.day-dot .day-tick{font-size:15px}
.day-dot.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.reward-tag{font-size:10px;font-weight:900;color:#c79400}
.streak-hint{text-align:center;font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:9px}
.streak-hint strong{color:var(--ink)}
.hint-coins{color:#c79400;font-weight:800}

/* Loyalty card */
.loyalty-card{background:linear-gradient(155deg,var(--blue) 0%,var(--blue-dark) 100%);border-radius:var(--radius);padding:20px 20px 16px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
.loyalty-card::after{content:'';position:absolute;top:-40%;right:-20%;width:60%;height:160%;background:rgba(255,255,255,.06);transform:rotate(20deg);pointer-events:none}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-tagline{font-size:15px;font-weight:800;max-width:60%;line-height:1.25}
.cups-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 14px}
.cup{aspect-ratio:1/1;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;position:relative;transition:background .25s,transform .2s}
.cup svg{width:56%;height:56%}
.cup-outline,.cup-rim{stroke:rgba(255,255,255,.85)}
.cup.filled{background:#fff}
.cup.filled .cup-outline,.cup.filled .cup-rim{stroke:var(--blue-dark)}
.cup .stamp{position:absolute;font-size:26px;font-weight:900;color:var(--blue-dark)}
.cup.free{background:rgba(245,197,24,.18);border:2px dashed rgba(255,255,255,.6)}
.cup.free .free-label{position:absolute;bottom:8px;font-size:11px;font-weight:900;letter-spacing:1px}
.cups-grid.all-ready .cup.free{background:var(--gold);border-color:var(--gold);color:var(--ink);animation:glow 1.3s ease-in-out infinite}
.cups-grid.all-ready .cup.free .cup-outline,.cups-grid.all-ready .cup.free .cup-rim{stroke:var(--ink)}
.cup.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.card-foot{font-size:13px;font-weight:700;opacity:.95;text-align:center}
.card-foot-free{color:var(--gold)}

.btn-coffee{width:100%;margin:16px 0;padding:18px;border-radius:16px;background:var(--ink);color:#fff;font-size:18px;font-weight:850;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px rgba(17,20,24,.25);transition:transform .08s}
.btn-coffee:active{transform:scale(.98)}
.coffee-emoji{font-size:22px}

.free-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#ffd95e 0%,var(--gold) 100%);border-radius:18px;padding:14px 16px;margin-bottom:16px;box-shadow:0 8px 20px rgba(245,180,24,.3);animation:rise .35s ease both}
.free-left{display:flex;align-items:center;gap:12px}
.free-count{font-size:26px;font-weight:900;color:var(--ink);white-space:nowrap}
.free-text{font-size:14px;font-weight:800;color:var(--ink);line-height:1.2}
.free-text span{display:block;font-size:11.5px;font-weight:600;color:#7a5c00;margin-top:2px}
.btn-claim{background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:11px 16px;border-radius:12px;white-space:nowrap;transition:transform .08s}
.btn-claim:active{transform:scale(.96)}
.btn-claim:disabled{opacity:.6}

.coin-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 16px rgba(8,60,100,.08);margin-bottom:16px}
.coin-head{display:flex;justify-content:space-between;align-items:center}
.coin-label{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.coin-balance{display:flex;align-items:center;gap:6px;font-size:30px;font-weight:900;color:var(--ink)}
.coin-balance.pulse{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.coin-icon{font-size:24px}
.coin-bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:14px 0 8px}
.coin-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),#ffd95e);border-radius:999px;transition:width .5s ease}
.coin-hint{font-size:13px;color:var(--muted);margin-bottom:14px}
.btn-redeem{width:100%;padding:14px;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;transition:transform .08s,opacity .2s}
.btn-redeem:active{transform:scale(.98)}
.btn-redeem:disabled{background:#c7d6e2;color:#fff;cursor:default}
.coin-fine{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}

.voucher-section{margin-bottom:16px}
.voucher-section h3{font-size:15px;margin:0 0 10px}
.voucher{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px dashed var(--blue);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.voucher-value{font-size:18px;font-weight:900;color:var(--blue-dark)}
.voucher-code{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px}
.btn-use{background:var(--blue);color:#fff;padding:9px 14px;border-radius:10px;font-weight:800;font-size:13px}
.voucher-note{font-size:12px;color:var(--muted);margin:4px 2px 0}

.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:#fff;border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 4px 12px rgba(8,60,100,.06)}
.stat strong{display:block;font-size:22px;font-weight:900;color:var(--blue-dark)}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

/* Demo-only controls */
.demo-bar{background:#fff;border:1px dashed #c7d6e2;border-radius:14px;padding:12px;text-align:center;margin-bottom:18px}
.demo-bar .demo-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
.demo-bar button{background:var(--soft);color:var(--ink);font-weight:700;font-size:13px;padding:9px 12px;border-radius:10px;margin:0 4px}
.demo-day{font-size:12px;color:var(--muted);margin-top:8px}

.dash-foot{text-align:center;font-size:11px;color:var(--muted);line-height:1.5}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:0 10px 26px rgba(0,0,0,.3);z-index:50;max-width:90vw;text-align:center;animation:toastIn .3s ease both}
.toast-success{background:var(--ok)}
.toast-error{background:var(--err)}

.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti-piece{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes flicker{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-3deg)}}
@keyframes flare{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(6deg)}60%{transform:scale(1.2) rotate(-4deg)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(245,197,24,.7)}50%{box-shadow:0 0 22px rgba(245,197,24,.9)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
</style>
</head>
<body>
<div id="app">
  <div style="min-height:100vh;display:grid;place-items:center;background:linear-gradient(165deg,#149be0,#0668a6);color:#fff;text-align:center;padding:30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <div>
      <div style="font-size:26px;font-weight:800;margin-bottom:10px">Falafels Loyalty</div>
      <div style="opacity:.9;font-size:15px;line-height:1.5">Loading the preview…<br>If this screen stays, tap the share icon and choose<br><b>Open in Safari</b> (or Chrome) to run it.</div>
    </div>
  </div>
</div>
<noscript>
  <div style="min-height:100vh;display:grid;place-items:center;background:#149be0;color:#fff;text-align:center;padding:30px;font-family:sans-serif">
    <div><b>JavaScript is off.</b><br>Open this file in Safari or Chrome to use the interactive preview.</div>
  </div>
</noscript>

<script>
// ---- Falafel economy (mirrors server/economy.js) --------------------------
const ECO = {
  PUNCHES_FOR_FREE: 8,
  SIGNUP_BONUS: 50,
  COINS_PER_COFFEE: 0,   // coins come from signup + streaks
  REDEEM_COINS: 200,
  REDEEM_VALUE_CENTS: 500,
  MIN_CHECKOUT_CENTS: 500,
  STREAK_3DAY_BONUS: 50,
  STREAK_7DAY_BONUS: 100, // signup 50 + day3 50 + day7 100 = 200 = $5
};

const KEY = 'falafel_demo_state';
const $ = (sel, el = document) => el.querySelector(sel);
const dollars = (c) => '$' + (c / 100).toFixed(c % 100 === 0 ? 0 : 2);

// Storage that survives "opaque origin" file:// pages (where localStorage
// throws a SecurityError) by falling back to an in-memory store.
const mem = {};
function storeGet(k) { try { return localStorage.getItem(k); } catch { return k in mem ? mem[k] : null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch { mem[k] = v; } }
function storeDel(k) { try { localStorage.removeItem(k); } catch { delete mem[k]; } }

function blankUser(name) {
  return {
    name, coins: ECO.SIGNUP_BONUS, punches: 0, freeCoffees: 0, freeRedeemed: 0,
    currentStreak: 0, longestStreak: 0, lastDay: null,
    totalCoffees: 0, vouchers: [], day: 1, // demo simulated day
  };
}

function load() {
  try { return JSON.parse(storeGet(KEY)); } catch { return null; }
}
function save(u) { storeSet(KEY, JSON.stringify(u)); }

let user = load();
let streakBumpKey = 0;
let coinPulse = false;

// ---- streak maths ----------------------------------------------------------
function applyStreak(u, today) {
  let streak = u.currentStreak || 0, sameDay = false;
  if (u.lastDay == null) streak = 1;
  else {
    const diff = today - u.lastDay;
    if (diff <= 0) sameDay = true;
    else if (diff === 1) streak += 1;
    else streak = 1;
  }
  let bonus = 0, milestone = null;
  if (!sameDay) {
    const cycle = streak % 7;
    if (cycle === 0) { bonus = ECO.STREAK_7DAY_BONUS; milestone = { days: streak, coins: bonus }; }
    else if (cycle === 3) { bonus = ECO.STREAK_3DAY_BONUS; milestone = { days: streak, coins: bonus }; }
  }
  return { streak, sameDay, bonus, milestone };
}

function weekPos(s) { return s <= 0 ? 0 : ((s - 1) % 7) + 1; }
function nextBonus(p) {
  if (p < 3) return { days: 3 - p, coins: 50 };
  if (p < 7) return { days: 7 - p, coins: 200 };
  return { days: 3, coins: 50 };
}

// ---- count-up animation ----------------------------------------------------
function animateNumber(el, to, dur = 650) {
  const from = parseInt(el.dataset.val || '0', 10);
  if (from === to) { el.textContent = to; return; }
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (t < 1) requestAnimationFrame(tick); else el.dataset.val = to;
  }
  el.dataset.val = from;
  requestAnimationFrame(tick);
}

// ---- effects ---------------------------------------------------------------
function toast(msg, kind = 'success') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + kind;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function confetti() {
  const colours = ['#149BE0', '#0B7FC4', '#F5C518', '#ffffff', '#7ed0ff'];
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('span');
    p.className = 'confetti-piece';
    const size = 6 + Math.random() * 8;
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colours[i % colours.length];
    p.style.width = size + 'px';
    p.style.height = size * 0.4 + 'px';
    p.style.animationDelay = (Math.random() * 0.3) + 's';
    p.style.animationDuration = (1.4 + Math.random() * 1.1) + 's';
    p.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    layer.appendChild(p);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 2800);
}

// ---- actions ---------------------------------------------------------------
function buyCoffee() {
  const prevStreak = user.currentStreak;
  const s = applyStreak(user, user.day);
  const earned = ECO.COINS_PER_COFFEE + s.bonus;

  user.coins += earned;
  user.totalCoffees += 1;
  user.currentStreak = s.streak;
  user.longestStreak = Math.max(user.longestStreak, s.streak);
  user.lastDay = user.day;

  // Every coffee is a stamp; filling the card banks a free coffee and resets.
  user.punches += 1;
  let freeEarned = false;
  if (user.punches >= ECO.PUNCHES_FOR_FREE) {
    user.punches = 0;
    user.freeCoffees += 1;
    freeEarned = true;
  }

  coinPulse = true;
  if (s.streak > prevStreak) streakBumpKey++;

  if (freeEarned) { confetti(); toast('Card full — free coffee earned! You have ' + user.freeCoffees + ' to claim'); }
  else if (s.milestone) { confetti(); toast(s.milestone.days + '-day streak! +' + s.milestone.coins + ' Falafel Coins'); }
  else if (earned > 0) toast('+' + earned + ' Falafel Coins · ' + s.streak + '-day streak');
  else toast('Stamp added · ' + s.streak + '-day streak');

  save(user); render();
}

function claimFreeCoffee() {
  if (user.freeCoffees < 1) return;
  user.freeCoffees -= 1;
  user.freeRedeemed += 1;
  confetti();
  toast('Enjoy your free coffee!');
  save(user); render();
}

function redeem() {
  if (user.coins < ECO.REDEEM_COINS) return;
  const code = 'FAL-' + Math.random().toString(36).slice(2, 6).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
  user.vouchers.unshift({ code, value: ECO.REDEEM_VALUE_CENTS, status: 'active' });
  user.coins -= ECO.REDEEM_COINS; // spend 200; remainder keeps stacking
  coinPulse = true;
  confetti();
  toast(dollars(ECO.REDEEM_VALUE_CENTS) + ' voucher unlocked! Code ' + code);
  save(user); render();
}

function useVoucher(code) {
  const v = user.vouchers.find((x) => x.code === code);
  if (v) v.status = 'used';
  toast('Voucher marked as used', 'success');
  save(user); render();
}

function nextDay() {
  user.day += 1;
  save(user); render();
  toast('Pretend it is the next day — buy a coffee to extend your streak');
}

function signup(name) {
  user = blankUser(name.trim() || 'Mate');
  save(user); render();
  toast('Welcome! +' + ECO.SIGNUP_BONUS + ' Falafel Coins to start');
}
function logout() { storeDel(KEY); user = null; render(); }

// ---- views -----------------------------------------------------------------
function authView() {
  return `
  <div class="auth-screen"><div class="auth-inner">
    <div class="logo-box"><span>Fala</span><span>Fels</span></div>
    <h1 class="auth-title">Falafels Loyalty</h1>
    <p class="auth-sub">Your coffee card, reimagined. Stamp every cup, build a streak, and earn Falafel Coins for free coffee.</p>
    <form class="auth-form" id="authForm">
      <label class="field"><span>Your name</span><input id="name" type="text" placeholder="e.g. Josh" autocomplete="off" required></label>
      <label class="field"><span>Password</span><input type="password" placeholder="Keep it simple"></label>
      <button class="btn-primary" type="submit">Create my card</button>
    </form>
    <p class="auth-foot">Preview build · Fala Fels · Mermaid Waters · @fala_fels</p>
  </div></div>`;
}

function cupSvg() {
  return `<svg viewBox="0 0 40 48" aria-hidden="true">
    <path class="cup-outline" d="M8 6 h24 l-3 30 a4 4 0 0 1 -4 3.6 h-6 a4 4 0 0 1 -4 -3.6 z" fill="none" stroke-width="2.4"/>
    <path class="cup-rim" d="M6 6 h28" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

function dashView() {
  const u = user;
  const punchesLeft = Math.max(0, ECO.PUNCHES_FOR_FREE - u.punches);
  const pos = weekPos(u.currentStreak);
  const nb = nextBonus(pos);
  const flameSize = 30 + Math.min(u.currentStreak, 14) * 1.6;

  let cups = '';
  for (let i = 0; i < ECO.PUNCHES_FOR_FREE; i++) {
    const filled = i < u.punches;
    cups += `<div class="cup ${filled ? 'filled' : ''}" data-cup="${i}">${cupSvg()}${filled ? '<span class="stamp">✓</span>' : ''}</div>`;
  }
  cups += `<div class="cup free">${cupSvg()}<span class="free-label">FREE</span></div>`;

  let dots = '';
  for (let i = 1; i <= 7; i++) {
    const filled = i <= pos;
    const reward = i === 3 ? ECO.STREAK_3DAY_BONUS : i === 7 ? ECO.STREAK_7DAY_BONUS : 0;
    dots += `<div class="day-wrap">
      <div class="day-dot ${filled ? 'on' : ''} ${reward ? 'is-reward' : ''}" data-day="${i}">${filled ? '<span class="day-tick">☕</span>' : '<span class="day-i">' + i + '</span>'}</div>
      ${reward ? '<span class="reward-tag">+' + reward + '</span>' : ''}
    </div>`;
  }

  const active = u.vouchers.filter((v) => v.status === 'active');
  const progress = Math.min(100, (u.coins / ECO.REDEEM_COINS) * 100);
  const canRedeem = u.coins >= ECO.REDEEM_COINS;

  return `
  <div class="dashboard">
    <header class="dash-header">
      <div><div class="hello">Hey ${u.name} 👋</div><div class="hello-sub">Falafels Loyalty</div></div>
      <button class="link-logout" id="logout">Log out</button>
    </header>

    <section class="streak-card ${u.currentStreak > 0 ? 'active' : ''}" id="streakCard">
      <div class="streak-head">
        <span class="streak-flame" style="font-size:${flameSize}px">🔥</span>
        <div class="streak-count">
          <div class="streak-num"><span id="streakNum" data-val="${u.currentStreak}">${u.currentStreak}</span><span class="streak-unit">day${u.currentStreak === 1 ? '' : 's'}</span></div>
          <div class="streak-label">${u.currentStreak > 0 ? 'streak going strong' : 'no streak yet'}</div>
        </div>
        <div class="streak-best"><strong>${u.longestStreak}</strong><span>best</span></div>
      </div>
      <div class="week-track">${dots}</div>
      <div class="streak-hint">${u.currentStreak > 0
        ? '<strong>' + nb.days + '</strong> day' + (nb.days === 1 ? '' : 's') + ' to your <span class="hint-coins">+' + nb.coins + ' 🪙</span> bonus'
        : 'Buy a coffee today to light the streak 🔥'}</div>
    </section>

    <div class="loyalty-card">
      <div class="card-top">
        <div class="card-tagline">Purchase 8 coffees &amp; get your 9th FREE!</div>
        <div class="logo-box small"><span>Fala</span><span>Fels</span></div>
      </div>
      <div class="cups-grid">${cups}</div>
      <div class="card-foot"><strong>${punchesLeft}</strong> more stamp${punchesLeft === 1 ? '' : 's'} until your next free coffee</div>
    </div>

    <button class="btn-coffee" id="buy"><span class="coffee-emoji">☕</span>I bought a coffee</button>

    ${u.freeCoffees > 0 ? `<section class="free-card">
      <div class="free-left">
        <div class="free-count">☕ ${u.freeCoffees}</div>
        <div class="free-text">free coffee${u.freeCoffees === 1 ? '' : 's'} ready<span>claim whenever you like — they keep stacking</span></div>
      </div>
      <button class="btn-claim" id="claim">Claim 1</button>
    </section>` : ''}

    <section class="coin-card">
      <div class="coin-head">
        <div class="coin-label">Falafel Coins</div>
        <div class="coin-balance ${coinPulse ? 'pulse' : ''}"><span class="coin-icon">🪙</span><span id="coinNum" data-val="${u.coins}">${u.coins}</span></div>
      </div>
      <div class="coin-bar"><div class="coin-bar-fill" style="width:${progress}%"></div></div>
      <div class="coin-hint">${canRedeem ? 'Ready to redeem ' + dollars(ECO.REDEEM_VALUE_CENTS) + ' off!' : (ECO.REDEEM_COINS - u.coins) + ' more coins to your next ' + dollars(ECO.REDEEM_VALUE_CENTS) + ' voucher'}</div>
      <button class="btn-redeem" id="redeem" ${canRedeem ? '' : 'disabled'}>Redeem ${ECO.REDEEM_COINS} coins → ${dollars(ECO.REDEEM_VALUE_CENTS)} off</button>
      <div class="coin-fine">Earn coins from your welcome bonus &amp; streaks · ${ECO.REDEEM_COINS} coins = ${dollars(ECO.REDEEM_VALUE_CENTS)} (min spend ${dollars(ECO.MIN_CHECKOUT_CENTS)}) · leftover coins keep stacking</div>
    </section>

    ${active.length ? `<section class="voucher-section"><h3>Your vouchers</h3>
      ${active.map((v) => `<div class="voucher"><div><div class="voucher-value">${dollars(v.value)} off</div><div class="voucher-code">${v.code}</div></div><button class="btn-use" data-use="${v.code}">Use at till</button></div>`).join('')}
      <p class="voucher-note">Show the code to staff to apply your discount.</p></section>` : ''}

    <section class="stats">
      <div class="stat"><strong>${u.totalCoffees}</strong><span>coffees</span></div>
      <div class="stat"><strong>${u.freeRedeemed}</strong><span>free claimed</span></div>
      <div class="stat"><strong>${u.longestStreak}</strong><span>best streak</span></div>
    </section>

    <div class="demo-bar">
      <div class="demo-title">Preview controls (not in the real app)</div>
      <button id="nextDay">⏭ Pretend it is tomorrow</button>
      <div class="demo-day">Simulated day: ${u.day} · come back a real day apart to keep streaks in the live app</div>
    </div>

    <footer class="dash-foot">Fala Fels · Shop 2c, 51-73 The Lanes Blv, Mermaid Waters · @fala_fels</footer>
  </div>`;
}

// ---- render + post-render animations --------------------------------------
function render() {
  const app = $('#app');
  if (!user) { app.innerHTML = authView(); $('#authForm').addEventListener('submit', (e) => { e.preventDefault(); signup($('#name').value); }); return; }

  app.innerHTML = dashView();
  $('#buy').addEventListener('click', buyCoffee);
  $('#redeem').addEventListener('click', redeem);
  $('#logout').addEventListener('click', logout);
  $('#nextDay').addEventListener('click', nextDay);
  const claimBtn = $('#claim');
  if (claimBtn) claimBtn.addEventListener('click', claimFreeCoffee);
  app.querySelectorAll('[data-use]').forEach((b) => b.addEventListener('click', () => useVoucher(b.dataset.use)));

  // count-up the coins + streak number
  const coinEl = $('#coinNum');
  animateNumber(coinEl, user.coins);
  const streakEl = $('#streakNum');
  animateNumber(streakEl, user.currentStreak);

  // streak flare + new-day pop when the streak just ticked up
  if (streakBumpKey > 0 && streakBumpKey !== render._lastBump) {
    render._lastBump = streakBumpKey;
    const card = $('#streakCard');
    card.classList.add('flare');
    setTimeout(() => card.classList.remove('flare'), 850);
    const dot = card.querySelector('[data-day="' + weekPos(user.currentStreak) + '"]');
    if (dot) { dot.classList.add('pop'); setTimeout(() => dot.classList.remove('pop'), 750); }
  }
  coinPulse = false;
}
render._lastBump = 0;

try {
  render();
} catch (err) {
  document.getElementById('app').innerHTML =
    '<div style="min-height:100vh;display:grid;place-items:center;background:#149be0;color:#fff;text-align:center;padding:30px;font-family:sans-serif">' +
    '<div><b>Preview error</b><br>' + String(err && err.message || err) + '</div></div>';
}
</script>
</body>
</html>
