name: Deploy Novagen site to GitHub Pages

# Publishes the static site in novagen-site/ to GitHub Pages at
# novagenaustralia.com.au (custom domain set via novagen-site/CNAME).
#
# One-time setup in the repo: Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". Then point DNS as described in novagen-site/DEPLOY.md.

on:
  push:
    branches: [main]
    paths:
      - "novagen-site/**"
      - ".github/workflows/deploy-novagen-site.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: novagen-site
      - id: deployment
        uses: actions/deploy-pages@v4
