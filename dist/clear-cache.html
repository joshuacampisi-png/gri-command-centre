<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clearing cache…</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F8F6F4; color: #181A1D; padding: 40px 20px; max-width: 500px; margin: 0 auto; }
    h1 { font-size: 24px; color: #E43F7B; }
    .status { padding: 14px 18px; border-radius: 10px; background: #FEF3C7; border: 1px solid #FDE68A; font-size: 14px; line-height: 1.5; margin: 14px 0; }
    .done { background: #DCFCE7; border-color: #A7F3D0; color: #047857; }
    .err  { background: #FEE2E2; border-color: #FECACA; color: #991B1B; }
    button { background: linear-gradient(135deg, #E43F7B, #d1356b); color: #fff; border: none; padding: 14px 28px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
    code { background: #F3F4F6; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>🧹 Clearing cache…</h1>
  <p>This page unregisters the service worker, deletes all cached files, and reloads the dashboard. Use this if you're stuck on old code.</p>
  <div id="status" class="status">Working…</div>
  <button id="reload" type="button" style="display:none" onclick="goHome()">Open fresh dashboard →</button>

  <script>
    const status = document.getElementById('status')
    const reloadBtn = document.getElementById('reload')
    const log = []

    function setStatus(text, cls) {
      log.push(text)
      status.innerHTML = log.map(l => '• ' + l).join('<br>')
      if (cls) status.className = 'status ' + cls
    }

    function goHome() {
      // Cache-bust query so the new HTML pull is guaranteed
      window.location.replace('/?cleared=' + Date.now())
    }

    ;(async () => {
      try {
        // 1. Unregister every service worker
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations()
          for (const r of regs) {
            await r.unregister()
            setStatus('Unregistered service worker: ' + (r.scope || 'unknown'))
          }
          if (regs.length === 0) setStatus('No service workers registered')
        } else {
          setStatus('Service workers not supported in this browser')
        }

        // 2. Delete every cache
        if ('caches' in window) {
          const keys = await caches.keys()
          for (const key of keys) {
            await caches.delete(key)
            setStatus('Deleted cache: ' + key)
          }
          if (keys.length === 0) setStatus('No caches found')
        }

        // 3. Clear local storage + session storage (just in case)
        try { localStorage.clear() ; setStatus('Cleared localStorage') } catch {}
        try { sessionStorage.clear() ; setStatus('Cleared sessionStorage') } catch {}

        setStatus('✓ All clear — opening fresh dashboard in 2 seconds…', 'done')
        reloadBtn.style.display = 'block'

        // Auto-reload after 2 seconds
        setTimeout(goHome, 2000)
      } catch (e) {
        setStatus('Error: ' + e.message, 'err')
        reloadBtn.style.display = 'block'
      }
    })()
  </script>
</body>
</html>
