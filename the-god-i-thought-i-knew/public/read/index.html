<body data-theme="night">

<div id="stage">
  <div id="bookwrap"><div id="book"></div></div>
</div>

<!-- Chrome -->
<header id="topbar" class="chrome">
  <button id="btn-contents" class="iconbtn" aria-label="Contents" title="Contents">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <div class="runninghead"><span id="rh-text">The God I Thought I Knew</span></div>
  <div class="topbar-right">
    <button id="btn-type" class="iconbtn" aria-label="Text settings" title="Text settings">
      <span class="aa">Aa</span>
    </button>
    <button id="btn-share" class="iconbtn" aria-label="Share this book" title="Share">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/></svg>
    </button>
  </div>
</header>

<nav id="pager" class="chrome">
  <button id="btn-prev" class="navbtn" aria-label="Previous page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="progress">
    <div class="track"><div id="fill" class="fill"></div></div>
    <div class="plabel" id="plabel">Cover</div>
  </div>
  <button id="btn-next" class="navbtn" aria-label="Next page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</nav>

<!-- Contents drawer -->
<div id="scrim" hidden></div>
<aside id="contents" hidden aria-label="Table of contents">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">Contents</div>
      <div class="drawer-sub">The God I Thought I Knew</div>
    </div>
    <button id="btn-close-contents" class="iconbtn" aria-label="Close contents">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <ol id="toc"></ol>
</aside>

<!-- Type settings -->
<div id="typepanel" hidden>
  <div class="row">
    <span class="row-label">Text size</span>
    <div class="stepper">
      <button id="btn-smaller" aria-label="Smaller text"><span class="s">A</span></button>
      <span id="sizeval">100%</span>
      <button id="btn-bigger" aria-label="Larger text"><span class="l">A</span></button>
    </div>
  </div>
  <div class="row">
    <span class="row-label">Page</span>
    <div class="themes" role="radiogroup" aria-label="Page theme">
      <button class="sw sw-day"   data-theme="day"   role="radio" aria-label="Day"><span>Day</span></button>
      <button class="sw sw-sepia" data-theme="sepia" role="radio" aria-label="Sepia"><span>Sepia</span></button>
      <button class="sw sw-night" data-theme="night" role="radio" aria-label="Night"><span>Night</span></button>
    </div>
  </div>
</div>

<!-- Resume toast -->
<div id="resume" hidden>
  <span id="resume-text"></span>
  <button id="resume-go">Continue</button>
  <button id="resume-dismiss" aria-label="Dismiss">&times;</button>
</div>

<!-- Boot / pagination screen -->
<div id="boot">
  <div class="boot-inner">
    <div class="boot-rule"></div>
    <h1 class="boot-title">The God<br>I Thought I Knew</h1>
    <div class="boot-author">Moses Campisi</div>
    <div class="boot-rule"></div>
    <div class="boot-bar"><div id="boot-fill"></div></div>
    <div class="boot-note" id="boot-note">Setting the type&hellip;</div>
  </div>
</div>

<div id="measure" aria-hidden="true"></div>
<div id="toast" hidden></div>

<script src="page-flip.browser.js"></script>
<script src="reader.js"></script>
</body>
