<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 800" role="img" aria-label="Sample Certificate of Analysis showing 99.2 percent purity">
  <defs>
    <linearGradient id="cg-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1E3F"/><stop offset="1" stop-color="#10294f"/>
    </linearGradient>
    <linearGradient id="cg-peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0BB4A6" stop-opacity="0.5"/><stop offset="1" stop-color="#0BB4A6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="620" height="800" fill="#ffffff"/>
  <rect x="0" y="0" width="620" height="800" fill="none" stroke="#E4EDF2" stroke-width="2"/>

  <!-- Header -->
  <rect x="0" y="0" width="620" height="112" fill="url(#cg-head)"/>
  <g transform="translate(34,34)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#0BB4A6"/>
    <path d="M14 32 L20 20 L26 30 L32 14" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="32" r="3.2" fill="#6EE7D6"/><circle cx="32" cy="14" r="3.2" fill="#6EE7D6"/>
  </g>
  <text x="94" y="52" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Novagen Australia</text>
  <text x="94" y="74" fill="#6EE7D6" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">CERTIFICATE OF ANALYSIS</text>
  <text x="586" y="46" text-anchor="end" fill="#9fb6cf" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">COA No.</text>
  <text x="586" y="70" text-anchor="end" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="700">NGA-2026-08417</text>

  <!-- Sample details grid -->
  <g font-family="Inter, Arial, sans-serif">
    <text x="34" y="152" fill="#6B7C90" font-size="10" font-weight="700" letter-spacing="1.5">SAMPLE ID</text>
    <text x="34" y="172" fill="#0E1B2C" font-size="14" font-weight="700">S-88213 &#183; Retatrutide 10mg</text>
    <text x="330" y="152" fill="#6B7C90" font-size="10" font-weight="700" letter-spacing="1.5">DATE RECEIVED</text>
    <text x="330" y="172" fill="#0E1B2C" font-size="14" font-weight="700">14 Jul 2026</text>

    <text x="34" y="204" fill="#6B7C90" font-size="10" font-weight="700" letter-spacing="1.5">METHOD</text>
    <text x="34" y="224" fill="#0E1B2C" font-size="14" font-weight="700">RP-HPLC / MS Identity</text>
    <text x="330" y="204" fill="#6B7C90" font-size="10" font-weight="700" letter-spacing="1.5">DATE REPORTED</text>
    <text x="330" y="224" fill="#0E1B2C" font-size="14" font-weight="700">16 Jul 2026</text>
  </g>
  <line x1="34" y1="248" x2="586" y2="248" stroke="#E4EDF2" stroke-width="1.5"/>

  <!-- Result headline -->
  <text x="34" y="290" fill="#0A1E3F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Purity Result</text>
  <g transform="translate(34,304)">
    <text x="0" y="56" fill="#0A1E3F" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="850" letter-spacing="-2">99.2%</text>
    <rect x="238" y="14" width="112" height="40" rx="20" fill="#eafaf0"/>
    <circle cx="262" cy="34" r="7" fill="#16A34A"/>
    <path d="M258.5 34 L261 36.5 L266 31" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="278" y="39" fill="#16A34A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">PASS</text>
  </g>
  <text x="34" y="386" fill="#6B7C90" font-family="Inter, Arial, sans-serif" font-size="12">Identity confirmed by mass spectrometry. Meets label claim within specification (&#8805;98.0%).</text>

  <!-- Chromatogram -->
  <g transform="translate(34,410)">
    <rect x="0" y="0" width="552" height="196" rx="12" fill="#F5F9FB" stroke="#E4EDF2"/>
    <text x="16" y="26" fill="#0A1E3F" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">HPLC CHROMATOGRAM (mAU vs min)</text>
    <!-- axes -->
    <line x1="24" y1="168" x2="536" y2="168" stroke="#C7D6E2" stroke-width="1.5"/>
    <line x1="24" y1="44" x2="24" y2="168" stroke="#C7D6E2" stroke-width="1.5"/>
    <!-- baseline noise + main peak -->
    <path d="M24 166 L120 165 L150 164 L200 165 L235 163
             L250 150 L262 60 L274 150 L290 162
             L340 164 L360 158 L372 164 L420 165 L470 164 L536 165"
          fill="url(#cg-peak)" stroke="#0BB4A6" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- small impurity peak -->
    <path d="M340 164 L360 158 L372 164" fill="none" stroke="#6D5EF6" stroke-width="2"/>
    <text x="256" y="52" fill="#067f76" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">Target 99.2%</text>
    <text x="352" y="150" fill="#6D5EF6" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700">0.8%</text>
  </g>

  <!-- Footer / sign-off -->
  <line x1="34" y1="640" x2="586" y2="640" stroke="#E4EDF2" stroke-width="1.5"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="34" y="678" fill="#6B7C90" font-size="10" font-weight="700" letter-spacing="1.5">ANALYST</text>
    <text x="34" y="700" fill="#0E1B2C" font-size="14" font-weight="700">Dr. A. Whitfield, PhD (Analytical Chem.)</text>
    <text x="34" y="722" fill="#6B7C90" font-size="11">Released under NATA-scoped, TGA-approved partner laboratory</text>
  </g>
  <!-- QR placeholder -->
  <g transform="translate(506,656)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="#fff" stroke="#0A1E3F" stroke-width="1.5"/>
    <g fill="#0A1E3F">
      <rect x="10" y="10" width="20" height="20"/><rect x="14" y="14" width="12" height="12" fill="#fff"/><rect x="18" y="18" width="4" height="4" fill="#0A1E3F"/>
      <rect x="50" y="10" width="20" height="20"/><rect x="54" y="14" width="12" height="12" fill="#fff"/><rect x="58" y="18" width="4" height="4" fill="#0A1E3F"/>
      <rect x="10" y="50" width="20" height="20"/><rect x="14" y="54" width="12" height="12" fill="#fff"/><rect x="18" y="58" width="4" height="4" fill="#0A1E3F"/>
      <rect x="38" y="10" width="5" height="5"/><rect x="38" y="22" width="5" height="5"/><rect x="38" y="38" width="5" height="5"/>
      <rect x="50" y="42" width="5" height="5"/><rect x="62" y="42" width="8" height="8"/><rect x="50" y="58" width="5" height="5"/>
      <rect x="62" y="62" width="8" height="8"/><rect x="46" y="50" width="5" height="5"/>
    </g>
  </g>
  <text x="506" y="750" fill="#6B7C90" font-family="Inter, Arial, sans-serif" font-size="9">Scan to verify</text>
</svg>
